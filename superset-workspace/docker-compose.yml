services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"   # доступ к базе с вашего ПК: localhost:5433, bi / bi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi"]
      interval: 3s
      retries: 20

  superset:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-to-a-long-random-string}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro
      - ./docker-init.sh:/app/docker-init.sh:ro
      - ./data:/app/data:ro
      - ../ddus:/app/ddus:ro
      - ../kit:/app/kit:ro
      - superset_home:/app/superset_home
    command: ["/bin/bash", "/app/docker-init.sh"]
    ports:
      - "8088:8088"

volumes:
  pgdata:
  superset_home:
